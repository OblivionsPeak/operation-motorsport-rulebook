name = "opmo-rulebook-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# KV namespace that stores the rulebook data blob.
# Create it with:  wrangler kv namespace create RULEBOOK
# then paste the printed id below.
[[kv_namespaces]]
binding = "RULEBOOK"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Optional: lock CORS to your GitHub Pages origin instead of "*".
# [vars]
# ALLOW_ORIGIN = "https://oblivionspeak.github.io"
